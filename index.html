<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>おうち学習 問題メーカー</title>
<style>
  :root{
    --bg:#f6f8fc; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
    --primary:#4f46e5; --primary-dark:#4338ca; --line:#dbe2ea;
    --soft:#eef2ff; --success:#15803d; --danger:#b91c1c;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic UI","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;
  }
  header{
    padding:28px 18px;color:#fff;
    background:linear-gradient(135deg,#4f46e5,#7c3aed);
  }
  header .inner{max-width:1080px;margin:auto}
  h1{margin:0;font-size:clamp(26px,5vw,42px)}
  header p{margin:8px 0 0;opacity:.93}
  main{max-width:1080px;margin:22px auto;padding:0 16px 40px}
  .tabs{display:flex;gap:10px;margin-bottom:16px}
  .tab{
    flex:1;border:0;border-radius:14px;padding:14px 12px;
    font-size:18px;font-weight:800;cursor:pointer;background:#e7eaf3;color:#334155
  }
  .tab.active{background:var(--primary);color:#fff}
  .card{
    background:var(--card);border-radius:18px;padding:20px;
    box-shadow:0 10px 30px rgba(31,41,55,.08);margin-bottom:18px
  }
  .controls{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
    gap:14px;align-items:end
  }
  label{display:block;font-weight:800;margin-bottom:7px}
  select,input[type="number"]{
    width:100%;padding:11px 12px;border:1px solid var(--line);
    border-radius:11px;background:#fff;font-size:16px
  }
  .checkline{display:flex;align-items:center;gap:8px;min-height:44px}
  input[type="checkbox"]{width:19px;height:19px}
  .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
  button.action{
    border:0;border-radius:11px;padding:11px 16px;font-size:16px;
    font-weight:800;cursor:pointer
  }
  .primary{background:var(--primary);color:#fff}
  .primary:hover{background:var(--primary-dark)}
  .secondary{background:#eef2ff;color:#3730a3}
  .ghost{background:#f3f4f6;color:#374151}
  .problem-header{
    display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap
  }
  .problem-header h2{margin:0}
  .badge{
    display:inline-block;background:var(--soft);color:#3730a3;
    border-radius:999px;padding:6px 10px;font-size:13px;font-weight:800
  }
  .problem-grid{
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
    column-gap:34px;row-gap:8px;margin-top:18px
  }
  .problem{
    min-height:50px;padding:8px 4px;border-bottom:1px dashed #cbd5e1;
    display:flex;align-items:center;font-size:22px
  }
  .num{display:inline-block;min-width:35px;color:#64748b;font-weight:700}
  .answer{margin-left:10px;color:var(--success);font-weight:900}
  .hidden{display:none!important}
  .small{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.6}
  .kanji-problem{font-size:19px;line-height:1.7}
  .writebox{
    display:inline-block;min-width:110px;height:32px;border-bottom:2px solid #64748b;
    vertical-align:bottom;margin-left:8px
  }
  .error{color:var(--danger);font-weight:700;margin-top:10px}
  footer{text-align:center;color:#94a3b8;font-size:12px;padding:14px}
  @media(max-width:700px){
    .problem-grid{grid-template-columns:1fr}
    .problem{font-size:20px}
  }

  .password-modal{
    position:fixed;inset:0;background:rgba(15,23,42,.58);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:9999
  }
  .password-dialog{
    width:min(420px,100%);background:#fff;border-radius:18px;padding:22px;
    box-shadow:0 24px 70px rgba(0,0,0,.25)
  }
  .password-dialog h3{margin:0 0 8px;font-size:22px}
  .password-dialog p{margin:0 0 14px;color:var(--muted);line-height:1.6}
  .password-dialog input{
    width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font-size:18px
  }
  .password-error{min-height:22px;color:var(--danger);font-weight:700;margin-top:8px}

  @media print{
    @page{size:A4;margin:12mm}
    body{background:#fff}
    header,.tabs,.settings-card,.screen-only,footer{display:none!important}
    main{max-width:none;margin:0;padding:0}
    .card{box-shadow:none;padding:0;margin:0}
    .problem-grid{grid-template-columns:repeat(2,1fr);column-gap:28px}
    .problem{font-size:18px;min-height:42px}
    .problem-header{margin-bottom:10px}
    .answer.print-hide{display:none!important}
  }
</style>
</head>
<body>
<header>
  <div class="inner">
    <h1>📘 おうち学習 問題メーカー</h1>
    <p>算数と漢字の問題を、毎回ランダムに20問つくります。</p>
  </div>
</header>

<main>
  <div class="tabs">
    <button class="tab active" id="mathTab" onclick="switchTab('math')">🔢 算数</button>
    <button class="tab" id="kanjiTab" onclick="switchTab('kanji')">✏️ 国語・漢字</button>
    <button class="tab" id="katakanaTab" onclick="switchTab('katakana')">📝 カタカナ</button>
  </div>

  <section id="mathSection">
    <div class="card settings-card">
      <div class="controls">
        <div>
          <label for="operation">計算</label>
          <select id="operation" onchange="refreshMathControls()">
            <option value="add">足し算（＋）</option>
            <option value="sub">引き算（－）</option>
            <option value="mul" selected>かけ算（×）</option>
            <option value="div">わり算（÷）</option>
          </select>
        </div>
        <div>
          <label id="leftLabel" for="leftDigits">左の数</label>
          <select id="leftDigits">
            <option value="1">1桁</option><option value="2" selected>2桁</option>
            <option value="3">3桁</option><option value="4">4桁</option>
            <option value="5">5桁</option>
          </select>
        </div>
        <div>
          <label id="rightLabel" for="rightDigits">右の数</label>
          <select id="rightDigits">
            <option value="1" selected>1桁</option><option value="2">2桁</option>
            <option value="3">3桁</option><option value="4">4桁</option>
          </select>
        </div>
        <div>
          <label for="mathCount">問題数</label>
          <select id="mathCount">
            <option>10</option><option selected>20</option><option>30</option><option>40</option>
          </select>
        </div>
        <div id="remainderBox" class="hidden">
          <label>わり算</label>
          <div class="checkline">
            <input id="allowRemainder" type="checkbox">
            <label for="allowRemainder" style="margin:0;font-weight:700">あまりありも出す</label>
          </div>
        </div>
      </div>
      <div class="actions">
        <button class="action primary" onclick="generateMath()">🎲 問題をつくる</button>
        <button class="action secondary" onclick="toggleAnswers('math')">👀 答え表示 / 非表示</button>
        <button class="action ghost" onclick="printProblems(false)">🖨️ 問題だけ印刷</button>
        <button class="action ghost" onclick="printProblems(true)">🖨️ 答えつき印刷</button>
      </div>
      <div class="small">わり算は「あまりなし」を基本にしています。「あまりありも出す」にチェックすると混在します。</div>
      <div id="mathError" class="error"></div>
    </div>

    <div class="card" id="mathPaper">
      <div class="problem-header">
        <h2>算数プリント</h2>
        <span class="badge" id="mathBadge">2桁 × 1桁 / 20問</span>
      </div>
      <div class="problem-grid" id="mathProblems"></div>
    </div>
  </section>

  <section id="kanjiSection" class="hidden">
    <div class="card settings-card">
      <div class="controls">
        <div>
          <label for="grade">学年</label>
          <select id="grade">
            <option value="1">小学1年生</option>
            <option value="2">小学2年生</option>
            <option value="3">小学3年生</option>
            <option value="4">小学4年生</option>
            <option value="5">小学5年生</option>
            <option value="6">小学6年生</option>
          </select>
        </div>
        <div>
          <label for="kanjiCount">問題数</label>
          <select id="kanjiCount">
            <option>10</option><option selected>20</option><option>30</option>
          </select>
        </div>
      </div>
      <div class="actions">
        <button class="action primary" onclick="generateKanji()">🎲 問題をつくる</button>
        <button class="action secondary" onclick="toggleAnswers('kanji')">👀 答え表示 / 非表示</button>
        <button class="action ghost" onclick="printProblems(false)">🖨️ 問題だけ印刷</button>
        <button class="action ghost" onclick="printProblems(true)">🖨️ 答えつき印刷</button>
      </div>
      <div class="small">文章の中の（ひらがな）部分を漢字に直す形式です。前後の文から、書く漢字が分かるようにしています。</div>
    </div>

    <div class="card" id="kanjiPaper">
      <div class="problem-header">
        <h2>漢字 書き取りプリント</h2>
        <span class="badge" id="kanjiBadge">小学1年生 / 20問</span>
      </div>
      <div class="problem-grid" id="kanjiProblems"></div>
    </div>
  </section>
  <section id="katakanaSection" class="hidden">
    <div class="card settings-card">
      <div class="controls">
        <div><label for="katakanaCount">問題数</label><select id="katakanaCount"><option>10</option><option selected>20</option><option>30</option><option>40</option></select></div>
      </div>
      <div class="actions">
        <button class="action primary" onclick="generateKatakana()">🎲 問題をつくる</button>
        <button class="action secondary" onclick="toggleAnswers('katakana')">👀 答え表示 / 非表示</button>
        <button class="action ghost" onclick="printProblems(false)">🖨️ 問題だけ印刷</button>
        <button class="action ghost" onclick="printProblems(true)">🖨️ 答えつき印刷</button>
      </div>
      <div class="small">ひらがなで表示された言葉を、カタカナに直して書く問題です。</div>
    </div>
    <div class="card" id="katakanaPaper">
      <div class="problem-header"><h2>カタカナ 書き取りプリント</h2><span class="badge" id="katakanaBadge">20問</span></div>
      <div class="problem-grid" id="katakanaProblems"></div>
    </div>
  </section>

</main>

<div id="passwordModal" class="password-modal hidden">
  <div class="password-dialog">
    <h3>🔒 保護者用</h3>
    <p>答えを見るにはパスワードを入力してください。</p>
    <input id="answerPassword" type="password" autocomplete="off" placeholder="パスワード"
           onkeydown="if(event.key==='Enter') submitPassword()">
    <div id="passwordError" class="password-error"></div>
    <div class="actions">
      <button class="action primary" onclick="submitPassword()">確認</button>
      <button class="action ghost" onclick="closePasswordModal()">キャンセル</button>
    </div>
  </div>
</div>

<footer>おうち学習 問題メーカー</footer>

function switchTab(tab){
  currentTab = tab;
  document.getElementById('mathSection').classList.toggle('hidden',tab!=='math');
  document.getElementById('kanjiSection').classList.toggle('hidden',tab!=='kanji');
  document.getElementById('katakanaSection').classList.toggle('hidden',tab!=='katakana');
  document.getElementById('mathTab').classList.toggle('active',tab==='math');
  document.getElementById('kanjiTab').classList.toggle('active',tab==='kanji');
  document.getElementById('katakanaTab').classList.toggle('active',tab==='katakana');

function refreshMathControls(){
  const op = document.getElementById('operation').value;
  const div = op === 'div';
  document.getElementById('remainderBox').classList.toggle('hidden',!div);
  document.getElementById('leftLabel').textContent = div ? 'わられる数' : '左の数';
  document.getElementById('rightLabel').textContent = div ? 'わる数' : '右の数';
}

function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function minForDigits(d){ return d===1 ? 1 : 10**(d-1); }
function maxForDigits(d){ return 10**d-1; }
function randomNDigit(d){ return randInt(minForDigits(d),maxForDigits(d)); }

function generateMath(){
  const op = document.getElementById('operation').value;
  const ld = Number(document.getElementById('leftDigits').value);
  const rd = Number(document.getElementById('rightDigits').value);
  const count = Number(document.getElementById('mathCount').value);
  const allowRemainder = document.getElementById('allowRemainder').checked;
  const box = document.getElementById('mathProblems');
  const err = document.getElementById('mathError');
  err.textContent = '';
  box.innerHTML = '';
  const seen = new Set();
  const questions = [];
  let guard = 0;

  while(questions.length < count && guard < 20000){
    guard++;
    let a,b,answer,key;

    if(op==='add'){
      a=randomNDigit(ld); b=randomNDigit(rd);
      key=`${a}+${b}`; if(seen.has(key)) continue;
      answer=String(a+b);
    }else if(op==='sub'){
      a=randomNDigit(ld); b=randomNDigit(rd);
      if(a < b) continue; // 答えがマイナスにならない
      key=`${a}-${b}`; if(seen.has(key)) continue;
      answer=String(a-b);
    }else if(op==='mul'){
      a=randomNDigit(ld); b=randomNDigit(rd);
      key=`${a}x${b}`; if(seen.has(key)) continue;
      answer=String(a*b);
    }else{
      b=randomNDigit(rd);
      if(allowRemainder && Math.random()<0.5){
        a=randomNDigit(ld);
        if(a < b) continue;
        const q=Math.floor(a/b), r=a%b;
        if(r===0) continue;
        answer=`${q} あまり ${r}`;
      }else{
        const amin=minForDigits(ld), amax=maxForDigits(ld);
        const qmin=Math.max(1,Math.ceil(amin/b));
        const qmax=Math.floor(amax/b);
        if(qmin>qmax) continue;
        const q=randInt(qmin,qmax);
        a=b*q; answer=String(q);
      }
      key=`${a}/${b}`; if(seen.has(key)) continue;
    }
    seen.add(key);
    questions.push({a,b,answer});
  }

  if(questions.length<count)
    err.textContent='この桁数の組み合わせでは問題を十分に作れません。桁数を変えてください。';

  const symbols={add:'＋',sub:'－',mul:'×',div:'÷'};
  questions.forEach((q,i)=>{
    const row=document.createElement('div');
    row.className='problem';
    row.innerHTML=`<span class="num">${i+1}.</span> ${q.a} ${symbols[op]} ${q.b} ＝ <span class="answer ${mathAnswersVisible?'':'hidden'}">${q.answer}</span>`;
    box.appendChild(row);
  });
  document.getElementById('mathBadge').textContent =
    `${ld}桁 ${symbols[op]} ${rd}桁 / ${questions.length}問`;
}

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function generateKanji(){
  const grade=Number(document.getElementById('grade').value);
  const count=Number(document.getElementById('kanjiCount').value);
  const list=shuffle(kanjiBank[grade]).slice(0,count);
  const box=document.getElementById('kanjiProblems');
  box.innerHTML='';
  list.forEach((item,i)=>{
    const [template,reading,answer]=item;
    const questionSentence=template.replace('{q}', `<strong>（${reading}）</strong>`);
    const row=document.createElement('div');
    row.className='problem kanji-problem';
    row.innerHTML=`<span class="num">${i+1}.</span><span>${questionSentence}</span><span class="writebox"></span><span class="answer ${kanjiAnswersVisible?'':'hidden'}">${answer}</span>`;
    box.appendChild(row);
  });
  document.getElementById('kanjiBadge').textContent=`小学${grade}年生 / ${list.length}問`;
}

function generateKatakana(){
  const count=Number(document.getElementById('katakanaCount').value);
  const list=shuffle(katakanaBank).slice(0,count);
  const box=document.getElementById('katakanaProblems');
  box.innerHTML='';
  list.forEach((item,i)=>{
    const [hiragana,katakana]=item;
    const row=document.createElement('div');
    row.className='problem kanji-problem';
    row.innerHTML=`<span class="num">${i+1}.</span>「${hiragana}」をカタカナで書きましょう。<span class="writebox"></span><span class="answer ${katakanaAnswersVisible?'':'hidden'}">${katakana}</span>`;
    box.appendChild(row);
  });
  document.getElementById('katakanaBadge').textContent=`${list.length}問`;
}

function openPasswordModal(action){
  pendingProtectedAction = action;
  document.getElementById('answerPassword').value = '';
  document.getElementById('passwordError').textContent = '';
  document.getElementById('passwordModal').classList.remove('hidden');
  setTimeout(()=>document.getElementById('answerPassword').focus(),50);
}

function closePasswordModal(){
  document.getElementById('passwordModal').classList.add('hidden');
  pendingProtectedAction = null;
}

function submitPassword(){
  const value=document.getElementById('answerPassword').value;
  if(value !== 'benkyosjinasai'){
    document.getElementById('passwordError').textContent='パスワードが違います。';
    document.getElementById('answerPassword').select();
    return;
  }
  const action=pendingProtectedAction;
  document.getElementById('passwordModal').classList.add('hidden');
  pendingProtectedAction=null;
  if(action) action();
}

function toggleAnswers(kind){
  const visible = kind==='math' ? mathAnswersVisible : kind==='kanji' ? kanjiAnswersVisible : katakanaAnswersVisible;
  if(visible){ setAnswerVisibility(kind,false); } else { openPasswordModal(()=>setAnswerVisibility(kind,true)); }
}

function setAnswerVisibility(kind,show){
  if(kind==='math') mathAnswersVisible=show;
  else if(kind==='kanji') kanjiAnswersVisible=show;
  else katakanaAnswersVisible=show;
  const root=document.getElementById(kind==='math'?'mathProblems':kind==='kanji'?'kanjiProblems':'katakanaProblems');
  root.querySelectorAll('.answer').forEach(el=>el.classList.toggle('hidden',!show));
}

function printProblems(withAnswers){
  if(withAnswers){
    openPasswordModal(()=>doPrintProblems(true));
  }else{
    doPrintProblems(false);
  }
}

function doPrintProblems(withAnswers){
  const root=document.getElementById(currentTab==='math'?'mathProblems':currentTab==='kanji'?'kanjiProblems':'katakanaProblems');
  root.querySelectorAll('.answer').forEach(el=>{
    el.classList.remove('print-hide');
    if(withAnswers){
      el.classList.remove('hidden');
    }else{
      el.classList.add('print-hide');
    }
  });
  window.print();
  root.querySelectorAll('.answer').forEach(el=>el.classList.remove('print-hide'));
  if(currentTab==='math' && !mathAnswersVisible) root.querySelectorAll('.answer').forEach(el=>el.classList.add('hidden'));
  if(currentTab==='kanji' && !kanjiAnswersVisible) root.querySelectorAll('.answer').forEach(el=>el.classList.add('hidden'));
  if(currentTab==='katakana' && !katakanaAnswersVisible) root.querySelectorAll('.answer').forEach(el=>el.classList.add('hidden'));
}

generateMath();
generateKanji();
generateKatakana();
